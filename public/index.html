<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SecureAI Notes</title>
  <link rel="icon" href="data:,">
  <!-- Secure and isolated context -->
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
  <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">
  <meta http-equiv="Permissions-Policy" content="cross-origin-isolated">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://storage.googleapis.com; connect-src 'self' https://storage.googleapis.com https://example.com; style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; worker-src 'self'; frame-src 'self';">
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <!-- Semantic UI CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/semantic-ui@2.4.2/dist/semantic.min.css">
  <!-- App Custom Styles -->
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="ui container">
    <header>
      <h1 class="ui header">SecureAI Notes</h1>
      <button id="themeToggle" class="ui icon button" title="Toggle theme"><i class="moon icon"></i></button>
    </header>
    <form class="ui form" onsubmit="return false;">
      <div class="field">
        <label for="exampleSelector">Load Example Note</label>
        <!-- Example selector: pick an example note to auto-fill below -->
        <select id="exampleSelector" style="width:100%;">
          <option value="" disabled selected>-- Choose an example --</option>
          <option value="Our onboarding process feels confusing to new hires. It could use clearer steps and a dedicated mentor.">Onboarding Feedback</option>
          <option value="The product performance deteriorates under heavy load and needs optimization before the next release.">Performance Issue</option>
          <option value="We delivered the project on time, but client testing found minor UI bugs that we should schedule fixes for.">Project Summary</option>
        </select>
      </div>
      <div class="field">
        <label for="note">Your Note</label>
        <textarea id="note" placeholder="Write your note here or select an example above..."></textarea>
      </div>
      <button id="analyzeBtn" type="button" class="ui primary button">AI Suggest</button>
    </form>
    <div id="suggestions" class="ui segment"></div>
    <div id="log" class="ui segment"></div>
    <!-- Service Worker Logs -->
    <details id="swLogsContainer" open>
      <summary>Service Worker Logs</summary>
      <pre id="swLogs"></pre>
    </details>
    <!-- Interactive Security Demo -->
    <section id="security-demo" class="ui segment" style="margin-top:1em;">
      <h3 class="ui header">Interactive Security Demo</h3>
      <button id="testNetworkBtn" class="ui button">Test Network Interception</button>
      <button id="testMessageBtn" class="ui button">Test Message Isolation</button>
      <div id="securityDemoResults" class="ui message" style="margin-top:1em;"></div>
    </section>
  </div>
  <!-- Hidden AI sandbox iframe for processing -->
  <iframe id="aiFrame" src="/ai-iframe.html" sandbox="allow-scripts allow-same-origin" hidden></iframe>
  <!-- Main application logic -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
