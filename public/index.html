<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SecureAI Notes</title>
  <link rel="icon" href="data:,">
  <!-- Secure and isolated context -->
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
  <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">
  <meta http-equiv="Permissions-Policy" content="cross-origin-isolated">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; worker-src 'self'; frame-src 'self';">
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <!-- App Styles (uncomment to enable custom CSS) -->
  <!-- <link rel="stylesheet" href="/style.css"> -->
</head>
<body>
  <div class="container">
    <header>
      <h1>SecureAI Notes</h1>
      <button id="themeToggle" class="theme-toggle" title="Toggle theme">🌓</button>
    </header>
    <textarea id="note" placeholder="Write your note here..."></textarea>
    <button id="analyzeBtn">AI Suggest</button>
  <div id="suggestions"></div>
  <div id="log"></div>
    <!-- Service Worker Logs -->
    <details id="swLogsContainer" open>
      <summary>Service Worker Logs</summary>
      <pre id="swLogs"></pre>
    </details>
  </div>
  <iframe id="aiFrame" src="ai-iframe.html" sandbox="allow-scripts allow-same-origin"></iframe>
  <!-- Loading Overlay -->
  <div id="loading" class="loading-overlay" hidden>
    <div class="spinner"></div>
  </div>
  <!-- import main JS module -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
